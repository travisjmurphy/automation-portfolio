name: Test and build apps

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app:
          - shopify-snapshot-compare
          - transcript-clip-planner
          - canadian-permit-explorer
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Test data and export logic
        run: npm test
      - name: Type-check and build
        run: npm run build
